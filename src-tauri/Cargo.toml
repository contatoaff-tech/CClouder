[package]
name = "cclouder"
version = "1.0.0"
description = "CCleaner-like system cleaner - open source, lightweight, fluid UI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["fs", "dialog", "shell", "process", "os", "tray-icon", "updater", "global-shortcut"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.11"
dirs = "5.0"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading",
  "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell"
] }
